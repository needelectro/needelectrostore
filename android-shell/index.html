<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#002B5B">
  <title>NEED ELECTRO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(180deg, #001B3A 0%, #002B5B 60%, #001730 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #008CFF 0%, #0056B3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 140, 255, 0.35);
    }
    .logo-icon {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #ffffff 0%, #AEE0FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 10px #EF4444;
    }
    .message {
      font-size: 14px;
      color: #CBD5E1;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #008CFF 0%, #0052CC 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 140, 255, 0.3);
    }
    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 4px 10px rgba(0, 140, 255, 0.2);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.15);
    }
    .footer-note {
      font-size: 12px;
      color: #64748B;
      margin-top: 16px;
    }
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <h1>NEED ELECTRO</h1>
    <div class="tagline">Laptops • CCTV • Electrical Solutions</div>

    <div class="status-badge">
      <div class="status-dot"></div>
      <span>No Internet Connection</span>
    </div>

    <p class="message">
      We couldn't connect to the server. Please check your mobile data or Wi-Fi connection and tap below to reload.
    </p>

    <button id="retryBtn" class="btn btn-primary" onclick="retryConnection()">
      <span id="btnText">Retry Connection</span>
      <div id="spinner" class="spinner"></div>
    </button>

    <a href="tel:+8801733983752" class="btn btn-secondary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      Call Hotline (+880 1733-983752)
    </a>

    <div class="footer-note">Amdads Group • Moulvibazar, Sylhet</div>
  </div>

  <script>
    const LIVE_URL = 'https://www.needelectro.store';

    function retryConnection() {
      const btn = document.getElementById('retryBtn');
      const text = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');

      text.style.display = 'none';
      spinner.style.display = 'inline-block';
      btn.disabled = true;

      fetch(LIVE_URL + '/api/health', { method: 'HEAD', cache: 'no-store', mode: 'no-cors' })
        .then(() => {
          window.location.href = LIVE_URL;
        })
        .catch(() => {
          setTimeout(() => {
            text.style.display = 'inline';
            spinner.style.display = 'none';
            btn.disabled = false;
          }, 1500);
        });
    }

    // Auto-reconnect when network becomes active
    window.addEventListener('online', () => {
      retryConnection();
    });
  </script>
</body>
</html>
