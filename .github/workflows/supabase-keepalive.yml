name: Supabase Free Plan Keep-Alive & Health Monitor

on:
  schedule:
    # Runs 4 times a day (every 6 hours) at minute 15: 02:15, 08:15, 14:15, 20:15 UTC
    # Offsetting from minute 0 avoids high-traffic GitHub Actions queue congestion
    - cron: '15 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target health endpoint URL'
        required: false
        default: 'https://needelectroerp.vercel.app/api/health'
        type: string

jobs:
  ping-keep-alive:
    name: Ping Database & Keep Alive
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Determine Target URL
        id: config
        run: |
          TARGET="${{ inputs.target_url }}"
          if [ -z "$TARGET" ]; then
            TARGET="${{ secrets.APP_URL }}"
            if [ -z "$TARGET" ]; then
              TARGET="https://needelectroerp.vercel.app/api/health"
            else
              TARGET="${TARGET%/}/api/health"
            fi
          fi
          echo "target_url=$TARGET" >> $GITHUB_OUTPUT
          echo "Configured Target URL: $TARGET"

      - name: Execute Health & Keep-Alive Ping
        id: ping
        env:
          TARGET_URL: ${{ steps.config.outputs.target_url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Sending automated heartbeat ping to: $TARGET_URL"
          
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi

          RESPONSE_FILE="/tmp/keepalive_response.txt"
          HTTP_STATUS=$(curl -sSL -X GET "$TARGET_URL" \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
            -H "User-Agent: NeedElectro-KeepAlive-Worker/1.0" \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            -w "%{http_code}" \
            -o "$RESPONSE_FILE")

          BODY=$(head -c 2000 "$RESPONSE_FILE")
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Preview: $BODY"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Status: SUCCESS - Supabase Database is reachable."
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "Status: FAILURE - Endpoint returned $HTTP_STATUS."
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Publish Health Summary to GitHub Step Summary
        if: always()
        run: |
          {
            echo "### 🏥 Supabase Keep-Alive & Health Check"
            echo "- **Target URL:** \`${{ steps.config.outputs.target_url }}\`"
            echo "- **Status:** ${{ steps.ping.outputs.status == 'success' && '✅ Healthy (Database Reachable)' || '❌ Degraded / Failed' }}"
            echo "- **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "#### Response Payload:"
            echo '```json'
            if [ -f /tmp/keepalive_response.txt ]; then
              cat /tmp/keepalive_response.txt | head -c 2000
            fi
            echo ""
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
