<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Need Electro Logo Tool</title>
  <style>
    body { font-family: sans-serif; background: #1e293b; color: white; padding: 20px; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
    canvas, img { max-width: 400px; display: block; }
    .light-bg { background: white; padding: 10px; border-radius: 4px; }
    .dark-bg { background: #0b1120; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Need Electro Official Master Logo Inspector & Exporter</h2>
  
  <div class="row">
    <div class="card">
      <h3>1. Original Uploaded Master (public/main-logo.jpg)</h3>
      <img id="origImg" src="/main-logo.jpg" />
    </div>

    <div class="card">
      <h3>2. Cropped & Transparent (Auto-Processed)</h3>
      <div class="dark-bg">
        <canvas id="transCanvas"></canvas>
      </div>
      <div style="margin-top: 10px;" class="light-bg">
        <canvas id="transCanvasLight"></canvas>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top: 20px;">
    <h3>Status & Data</h3>
    <pre id="output">Processing...</pre>
    <button id="saveBtn" style="padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Export Cropped PNGs to Server
    </button>
  </div>

  <script>
    const img = document.getElementById('origImg');
    const out = document.getElementById('output');

    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, c.width, c.height);
      const data = imgData.data;

      // Find bounding box of non-white pixels
      let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
      for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
          const idx = (y * c.width + x) * 4;
          const r = data[idx];
          const g = data[idx+1];
          const b = data[idx+2];
          // If not near-white
          if (r < 240 || g < 240 || b < 240) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      // Add small margin
      const pad = 12;
      minX = Math.max(0, minX - pad);
      minY = Math.max(0, minY - pad);
      maxX = Math.min(c.width - 1, maxX + pad);
      maxY = Math.min(c.height - 1, maxY + pad);

      const cropW = maxX - minX + 1;
      const cropH = maxY - minY + 1;

      out.textContent = `Original: ${c.width}x${c.height}\n` +
                        `Bounding Box: x=${minX}, y=${minY}, w=${cropW}, h=${cropH}\n` +
                        `Aspect Ratio: ${(cropW / cropH).toFixed(3)}`;

      // Draw cropped transparent to transCanvas
      const tc = document.getElementById('transCanvas');
      tc.width = cropW;
      tc.height = cropH;
      const tctx = tc.getContext('2d');

      const cropImgData = ctx.getImageData(minX, minY, cropW, cropH);
      const cd = cropImgData.data;

      // Transparent processing:
      // Make background white transparent, but preserve white inside the lightning bolt!
      // How to preserve white inside the lightning bolt?
      // Flood fill from outer boundaries (0,0) to find all background pixels!
      const isBg = new Uint8Array(cropW * cropH);
      const queue = [];

      // Add perimeter to queue
      for (let x = 0; x < cropW; x++) {
        queue.push(x, 0);
        queue.push(x, cropH - 1);
      }
      for (let y = 0; y < cropH; y++) {
        queue.push(0, y);
        queue.push(cropW - 1, y);
      }

      while (queue.length > 0) {
        const y = queue.pop();
        const x = queue.pop();
        const pIdx = y * cropW + x;
        if (isBg[pIdx]) continue;

        const dIdx = pIdx * 4;
        const r = cd[dIdx];
        const g = cd[dIdx+1];
        const b = cd[dIdx+2];

        // If it's whitish (background)
        if (r > 220 && g > 220 && b > 220) {
          isBg[pIdx] = 1;
          if (x > 0 && !isBg[y * cropW + (x - 1)]) queue.push(x - 1, y);
          if (x < cropW - 1 && !isBg[y * cropW + (x + 1)]) queue.push(x + 1, y);
          if (y > 0 && !isBg[(y - 1) * cropW + x]) queue.push(x, y - 1);
          if (y < cropH - 1 && !isBg[(y + 1) * cropW + x]) queue.push(x, y + 1);
        }
      }

      // Apply transparency only to outer background
      for (let i = 0; i < cropW * cropH; i++) {
        if (isBg[i]) {
          const dIdx = i * 4;
          const r = cd[dIdx];
          const g = cd[dIdx+1];
          const b = cd[dIdx+2];
          const brightness = (r + g + b) / 3;
          if (brightness > 240) {
            cd[dIdx + 3] = 0;
          } else {
            // antialias fringe
            cd[dIdx + 3] = Math.max(0, 255 - brightness);
          }
        }
      }

      tctx.putImageData(cropImgData, 0, 0);

      // 1. Create Dark-mode friendly version
      const darkCanvas = document.createElement('canvas');
      darkCanvas.width = cropW;
      darkCanvas.height = cropH;
      const dctx = darkCanvas.getContext('2d');
      const darkImgData = tctx.getImageData(0, 0, cropW, cropH);
      const dd = darkImgData.data;

      // Invert black text to white for dark mode (keep blue and keep bolt intact)
      for (let y = 0; y < cropH; y++) {
        for (let x = 0; x < cropW; x++) {
          const idx = (y * cropW + x) * 4;
          const alpha = dd[idx + 3];
          if (alpha > 30) {
            const r = dd[idx];
            const g = dd[idx + 1];
            const b = dd[idx + 2];

            // If it's the text region (x > cropW * 0.22 or y > cropH * 0.75)
            // and it is black/dark grey (r < 75, g < 75, b < 75)
            if ((x > cropW * 0.22 || y > cropH * 0.75) && r < 80 && g < 80 && b < 80) {
              dd[idx] = 255;
              dd[idx + 1] = 255;
              dd[idx + 2] = 255;
            }
          }
        }
      }
      dctx.putImageData(darkImgData, 0, 0);

      // 2. Create Icon-only canvas (strictly the lightning bolt, excluding letters)
      const subW = Math.round(cropW * 0.23);
      const subH = Math.round(cropH * 0.82);
      const boltData = tctx.getImageData(0, 0, subW, subH);
      const bd = boltData.data;

      let bMinX = subW, bMinY = subH, bMaxX = 0, bMaxY = 0;
      for (let y = 0; y < subH; y++) {
        for (let x = 0; x < subW; x++) {
          const idx = (y * subW + x) * 4;
          if (bd[idx + 3] > 30) {
            if (x < bMinX) bMinX = x;
            if (x > bMaxX) bMaxX = x;
            if (y < bMinY) bMinY = y;
            if (y > bMaxY) bMaxY = y;
          }
        }
      }

      const iconW = bMaxX - bMinX + 1;
      const iconH = bMaxY - bMinY + 1;
      const iconCanvas = document.createElement('canvas');
      iconCanvas.width = iconW;
      iconCanvas.height = iconH;
      const ictx = iconCanvas.getContext('2d');
      ictx.drawImage(tc, bMinX, bMinY, iconW, iconH, 0, 0, iconW, iconH);

      // Light preview
      const tcl = document.getElementById('transCanvasLight');
      tcl.width = cropW;
      tcl.height = cropH;
      const tclCtx = tcl.getContext('2d');
      tclCtx.drawImage(tc, 0, 0);

      const transparentPng = tc.toDataURL('image/png');
      const darkTransparentPng = darkCanvas.toDataURL('image/png');
      const iconPng = iconCanvas.toDataURL('image/png');

      // Auto POST all 3 assets to helper server
      fetch('http://localhost:4567/save-logo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          transparentPng,
          darkTransparentPng,
          iconPng
        })
      }).then(() => {
        out.textContent += '\n✓ Saved logo-transparent.png, logo-dark-transparent.png, and logo-icon.png successfully!';
      }).catch(err => {
        out.textContent += '\nHelper server error: ' + err.message;
      });
    };
  </script>
</body>
</html>
